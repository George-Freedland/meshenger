name: meshenger
description: Offline, end-to-end encrypted messenger that relays messages over a Bluetooth mesh.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  go_router: ^17.1.0

  # Identity: keys in the OS keychain; Ed25519, X25519 and AES-GCM
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.9.0
  uuid: ^4.5.2

  # Bluetooth LE, central and peripheral (patched platform plugins below)
  bluetooth_low_energy: ^6.2.1

  # Contact QR codes: showing and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4

  # Settings and chats; files on disk
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5

  # Photos, files, voice recording, thumbnails
  image_picker: ^1.2.3
  file_selector: ^1.1.0
  record: ^6.2.1
  image: ^4.12.0

  # Every song, video, voice note and alert tone (libmpv)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Network pages, links, saving and sharing files
  flutter_widget_from_html_core: ^0.17.4
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

  flutter_local_notifications: ^22.3.0
  # Only while a Mesh Map location setting is on
  geolocator: ^14.1.2
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  msix: ^3.18.0

dependency_overrides:
  # Patched copies; CONTRIBUTING.md lists every change.
  # Windows: connects to macOS/iOS peripherals (random addresses), delivers
  # callbacks on the platform thread, restarts advertising when Windows
  # stops it, and asks for fast connections while streaming a transfer.
  bluetooth_low_energy_windows:
    path: packages/bluetooth_low_energy_windows
  # macOS/iOS: holds writes without response until CoreBluetooth has room
  # (it silently drops them otherwise), keeps separate writes apart, and
  # asks for low-latency connections while pushing a transfer.
  bluetooth_low_energy_darwin:
    path: packages/bluetooth_low_energy_darwin
  # Android: asks for a high-priority (fast) connection while streaming a
  # transfer, and lets it go when idle.
  bluetooth_low_energy_android:
    path: packages/bluetooth_low_energy_android

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    # Offline world for the Mesh Map globe (Natural Earth, public domain;
    # rebuilt by tool/build_world_geo.dart).
    - assets/geo/world.bin
    - TERMS.md

# Regenerate every platform's app icon after changing the image:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#00030D"
  adaptive_icon_foreground: assets/branding/icon_android_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/branding/icon_macos.png
  windows:
    generate: true
    icon_size: 256
  web:
    generate: true
    background_color: "#05070A"
    theme_color: "#05070A"

# Microsoft Store package (on Windows: dart run msix:create). Replace the
# two PARTNER_CENTER values with Partner Center → your app → Product
# identity (see CONTRIBUTING.md). The Store signs the package itself.
msix_config:
  display_name: Meshenger
  publisher_display_name: George Freedland
  identity_name: PARTNER_CENTER_PACKAGE_IDENTITY_NAME
  publisher: PARTNER_CENTER_PACKAGE_IDENTITY_PUBLISHER
  # The Store needs the last number to be 0; bump the first three per release.
  msix_version: 1.0.0.0
  logo_path: assets/branding/icon.png
  # Bluetooth, mic and camera for voice and photos, location for the Mesh
  # Map. No internet.
  capabilities: bluetooth,microphone,webcam,location
  store: true
