name: meshenger
description: Offline Bluetooth-based messenger with crypto identity.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: any

  # Secure storage for encrypted keys
  flutter_secure_storage: any

  # Cryptographic primitives (Ed25519, X25519, etc.)
  cryptography: any

  # UUIDs for message / device identifiers
  uuid: any

  # QR scanning for contact / identity sharing (future)
  mobile_scanner: any

  # QR code rendering
  qr_flutter: any

  # Simple local persistence (web/mobile/desktop)
  shared_preferences: any
  bluetooth_low_energy: ^6.2.1

  # Media: pick images (camera on mobile, files on desktop)
  image_picker: any

  # Generic file import for the Storage app
  file_selector: any

  # Voice memos / push-to-talk recording
  record: any

  # App-support directory for the media library
  path_provider: any
  flutter_local_notifications: ^22.3.0
  flutter_widget_from_html_core: ^0.17.4
  url_launcher: ^6.3.3
  image: ^4.12.0
  # Every song, video, voice note and alert tone (libmpv)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  share_plus: ^13.3.1
  geolocator: ^14.1.2
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  msix: ^3.18.0

dependency_overrides:
  # Patched copy: passes the discovered Bluetooth address type to
  # FromBluetoothAddressAsync so Windows can connect to macOS/iOS peripherals
  # (they use random addressing; the plugin's default assumes public and
  # silently fails). See packages/bluetooth_low_energy_windows/windows.
  bluetooth_low_energy_windows:
    path: packages/bluetooth_low_energy_windows
  # Patched copy: holds writes without response until CoreBluetooth has
  # room (it silently drops them otherwise), keeps separate writes apart,
  # and asks for low-latency connections while pushing a transfer.
  bluetooth_low_energy_darwin:
    path: packages/bluetooth_low_energy_darwin
  # Patched copy: asks for a high-priority (fast) connection while
  # streaming a transfer, and lets it go when idle.
  bluetooth_low_energy_android:
    path: packages/bluetooth_low_energy_android

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    # Offline world for the Mesh Map globe (Natural Earth, public domain;
    # rebuilt by tool/build_world_geo.dart).
    - assets/geo/world.bin
    - TERMS.md

# Regenerate every platform's app icon after changing the image:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#00030D"
  adaptive_icon_foreground: assets/branding/icon_android_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/branding/icon_macos.png
  windows:
    generate: true
    icon_size: 256
  web:
    generate: true
    background_color: "#05070A"
    theme_color: "#05070A"

# Microsoft Store package (on Windows: dart run msix:create). Replace the
# two PARTNER_CENTER values with Partner Center → your app → Product
# identity (see LAUNCH.md 3.5). The Store signs the package itself.
msix_config:
  display_name: Meshenger
  publisher_display_name: George Freedland
  identity_name: PARTNER_CENTER_PACKAGE_IDENTITY_NAME
  publisher: PARTNER_CENTER_PACKAGE_IDENTITY_PUBLISHER
  # The Store needs the last number to be 0; bump the first three per release.
  msix_version: 1.0.0.0
  logo_path: assets/branding/icon.png
  # Bluetooth, plus mic and camera for voice and photos. No internet.
  capabilities: bluetooth,microphone,webcam,location
  store: true
