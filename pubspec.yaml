name: meshenger
description: Offline Bluetooth-based messenger with crypto identity.
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: any

  # Secure storage for encrypted keys
  flutter_secure_storage: any

  # Cryptographic primitives (Ed25519, X25519, etc.)
  cryptography: any

  # UUIDs for message / device identifiers
  uuid: any

  # QR scanning for contact / identity sharing (future)
  mobile_scanner: any

  # QR code rendering
  qr_flutter: any

  # Simple local persistence (web/mobile/desktop)
  shared_preferences: any
  bluetooth_low_energy: ^6.2.1

  # Media: pick images (camera on mobile, files on desktop)
  image_picker: any

  # Generic file import for the Storage app
  file_selector: any

  # Voice memos / push-to-talk recording
  record: any

  # Audio playback (voice memos, voicemail, audio messages)
  audioplayers: any

  # App-support directory for the media library
  path_provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

dependency_overrides:
  # Patched copy: passes the discovered Bluetooth address type to
  # FromBluetoothAddressAsync so Windows can connect to macOS/iOS peripherals
  # (they use random addressing; the plugin's default assumes public and
  # silently fails). See packages/bluetooth_low_energy_windows/windows.
  bluetooth_low_energy_windows:
    path: packages/bluetooth_low_energy_windows

flutter:
  uses-material-design: true
